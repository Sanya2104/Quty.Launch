# gradle/libs.versions.toml #

[versions]
agp = "9.2.1"
kotlin = "2.3.21"
appcompat = "1.7.1"
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
serializationJson = "1.11.0"
androidxWebkit = "1.16.0"
material = "1.14.0"
viewpager2 = "1.1.0"
fragmentKtx = "1.8.9"

[libraries]
# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# WebKit
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }

# Material Design
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# ViewPager2
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }

# Fragment
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }